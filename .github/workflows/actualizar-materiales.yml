name: Actualizar materiales para el aula

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar los archivos del repositorio
        uses: actions/checkout@v7

      - name: Generar la tabla del README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "users/${GITHUB_REPOSITORY_OWNER}/repos?type=owner&sort=created&direction=desc&per_page=100" \
            > "$RUNNER_TEMP/repos.json"

          python3 - <<'PY'
          import json
          import os
          from html import escape
          from pathlib import Path

          repos_json = Path(os.environ["RUNNER_TEMP"]) / "repos.json"
          paginas = json.loads(repos_json.read_text(encoding="utf-8"))
          materiales = [
              repo for pagina in paginas for repo in pagina
              if "material-aula" in repo.get("topics", [])
          ][:4]

          if materiales:
              filas = ["| Repositorio | Contenido |", "| --- | --- |"]
              for repo in materiales:
                  descripcion = repo["description"] or "Sin descripción"
                  descripcion = escape(" ".join(descripcion.split()), quote=False)
                  descripcion = descripcion.replace("\\", "&#92;").replace("|", "&#124;")
                  filas.append(
                      f"| [{repo['name']}]({repo['html_url']}) | {descripcion} |"
                  )
          else:
              filas = ["Todavía no hay repositorios con el tema `material-aula`."]

          readme = Path("README.md")
          contenido = readme.read_text(encoding="utf-8")
          inicio = "<!-- MATERIALES:INICIO -->"
          fin = "<!-- MATERIALES:FIN -->"

          if contenido.count(inicio) != 1 or contenido.count(fin) != 1:
              raise SystemExit("El README debe contener una vez cada marcador.")

          antes, despues_del_inicio = contenido.split(inicio)
          if fin not in despues_del_inicio:
              raise SystemExit("El marcador de fin debe ir después del de inicio.")

          _, despues = despues_del_inicio.split(fin)
          tabla = "\n".join(filas)
          readme.write_text(
              f"{antes}{inicio}\n\n{tabla}\n\n{fin}{despues}",
              encoding="utf-8",
          )
          print(f"Repositorios incluidos: {len(materiales)}")
          PY

      - name: Guardar el cambio si hay diferencias
        run: |
          if git diff --quiet -- README.md; then
            echo "La tabla ya está al día."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizar materiales para el aula"
          git push
